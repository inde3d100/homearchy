name: Feature request
description: Propose a focused Homearchy improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      options:
        - label: I searched existing issues for this request.
          required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Hints and search
        - Grid navigation
        - Scroll mode
        - Monitor selection
        - Omarchy service
        - Bar widget
        - Setup and bindings
        - Packaging
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the current limitation and a concrete workflow affected by it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the observable result, not an implementation preference.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
